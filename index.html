<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>武汉两天一晚</title><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f4f7fb;color:#172033}.loading{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px}.spinner{width:36px;height:36px;border:4px solid #dbeafe;border-top-color:#2075ea;border-radius:50%;animation:r 1s linear infinite}@keyframes r{to{transform:rotate(360deg)}}.hint{font-size:14px;color:#667085}</style></head><body><div class="loading"><div class="spinner"></div><div class="hint">正在打开武汉两天一晚攻略…</div></div><script>(async()=>{try{const files=["part01.txt","part02.txt","part03.txt","part04.txt","part05.txt","part06.txt","part07.txt","part08.txt","part09.txt","part10.txt"];const texts=await Promise.all(files.map(f=>fetch(f,{cache:'force-cache'}).then(r=>{if(!r.ok)throw new Error(f+' '+r.status);return r.text()})));const html=texts.join('');document.open();document.write(html);document.close();}catch(e){document.body.innerHTML='<div style="padding:24px;font-family:sans-serif"><h2>页面加载失败</h2><p>请刷新页面后重试。</p><pre style="white-space:pre-wrap">'+String(e)+'</pre></div>'}})();</script></body></html>
